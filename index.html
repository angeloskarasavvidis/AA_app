<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fde7ee" />
  <title>Couplebook</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Couplebook" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <span class="pill">Sign in</span>

      <div class="login-logo">
        <span class="logo-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 21s-6.716-4.35-9.428-8.485C.678 9.5 1.5 5.5 5 4.2c2.1-.8 4.2.1 5.5 2.1 1-2 3.1-2.9 5.2-2.1 3.5 1.3 4.3 5.3 2.4 8.3C18.7 16.65 12 21 12 21z"/></svg>
        </span>
      </div>

      <h1>Couplebook <span class="heart">&lt;3</span></h1>

      <form class="login-form" id="loginForm">
        <input
          type="email"
          class="text-input"
          id="emailInput"
          placeholder="Email"
          autocomplete="username"
          autofocus
          required
        />
        <input
          type="password"
          class="text-input"
          id="passwordInput"
          placeholder="Password"
          autocomplete="current-password"
          required
        />
        <button type="submit" class="btn-primary" id="loginSubmitBtn">Sign in <span class="heart">🔓</span></button>
        <p class="form-error" id="loginError">That didn't work — check your email &amp; password.</p>
      </form>

      <div class="stars-row">★ ★ ★ ★ ★</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
