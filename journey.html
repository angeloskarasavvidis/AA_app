<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fde7ee" />
  <title>The double A journey &lt;3</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function () {
      var profile = localStorage.getItem('aa_profile');
      if (!profile) {
        window.location.replace('index.html');
        return;
      }
      if (profile === 'Angelos') {
        document.documentElement.classList.add('theme-blue');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#e8f1fe');
      }
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <span class="logo-badge">AA</span>
      <span class="logo-text">The double A journey <span class="heart">&lt;3</span></span>
    </div>
    <button class="switch-btn" id="switchBtn">Switch</button>
  </header>

  <div class="countdown-banner" id="countdownBanner"></div>

  <nav class="month-nav" id="monthNav"></nav>

  <main class="content" id="content"></main>

  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="" />
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/data.js"></script>
  <script src="js/journey.js"></script>
</body>
</html>
