<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fde7ee" />
  <title>Couplebook</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Couplebook" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <span class="logo-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 21s-6.716-4.35-9.428-8.485C.678 9.5 1.5 5.5 5 4.2c2.1-.8 4.2.1 5.5 2.1 1-2 3.1-2.9 5.2-2.1 3.5 1.3 4.3 5.3 2.4 8.3C18.7 16.65 12 21 12 21z"/></svg>
      </span>
      <span class="logo-text">Couplebook <span class="heart">&lt;3</span></span>
    </div>
    <span class="streak-badge" id="streakBadge"></span>
  </header>

  <section id="journeyView">
    <nav class="month-nav" id="monthNav"></nav>
    <main class="content" id="content"></main>
  </section>

  <section id="profileView" class="content hidden">
    <div class="card profile-card">
      <div class="profile-avatar" id="profileAvatar"></div>
      <h2 id="profileName"></h2>
      <p class="profile-tagline">Half of the Couplebook <span class="heart">&lt;3</span></p>

      <div class="profile-stats">
        <div class="stat">
          <div class="stat-value" id="statDays">—</div>
          <div class="stat-label">Days together</div>
        </div>
        <!-- <div class="stat">
          <div class="stat-value" id="statMonths">—</div>
          <div class="stat-label">Months logged</div>
        </div> -->
      </div>
    </div>

    <div class="card">
      <button class="btn-primary sign-out-btn" id="signOutBtn">Sign out</button>
    </div>
  </section>

  <section id="wallView" class="content hidden">
    <div class="card">
      <form id="noteForm">
        <textarea id="noteInput" class="text-input note-textarea" placeholder="Leave a note for them..." maxlength="280" required></textarea>
        <button type="submit" class="btn-primary" id="noteSubmitBtn">Pin it up 📌</button>
      </form>
    </div>

    <div id="wallEmpty" class="photo-empty hidden">📌 No notes yet — be the first to leave one!</div>

    <div id="pinnedNotes"></div>
    <div id="allNotes"></div>
  </section>

  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="" />
  </div>

  <nav class="bottom-nav">
    <button class="bottom-nav-btn active" data-view="journey">
      <svg viewBox="0 0 24 24"><path d="M12 21s-6.716-4.35-9.428-8.485C.678 9.5 1.5 5.5 5 4.2c2.1-.8 4.2.1 5.5 2.1 1-2 3.1-2.9 5.2-2.1 3.5 1.3 4.3 5.3 2.4 8.3C18.7 16.65 12 21 12 21z"/></svg>
      <span>Journey</span>
    </button>
    <button class="bottom-nav-btn" data-view="wall">
      <svg viewBox="0 0 24 24"><path d="M14 2a1 1 0 0 1 1 1v6.28l3.6 3.6a1 1 0 0 1 .29.71V15a1 1 0 0 1-1 1h-4.5l-.4 5.6a1 1 0 0 1-2 0L10.6 16H6a1 1 0 0 1-1-1v-1.41a1 1 0 0 1 .3-.71L9 9.28V3a1 1 0 0 1 1-1h4z"/></svg>
      <span>Wall</span>
    </button>
    <button class="bottom-nav-btn" data-view="profile">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7.5 8-7.5s8 3.1 8 7.5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/></svg>
      <span>Profile</span>
    </button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/data.js"></script>
  <script src="js/journey.js"></script>
</body>
</html>
